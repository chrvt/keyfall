[project]
name = "keyfall"
version = "0.1.0"
description = "Learn piano pieces with falling notes, learning paths and a jazz improvisation course – runs locally in your browser."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["piano", "music", "practice", "midi", "jazz"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
keyfall = "keyfall.__main__:main"

[project.urls]
Homepage = "https://github.com/chrvt/keyfall"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keyfall"]
artifacts = ["keyfall/static/**"]

[tool.hatch.build.targets.sdist]
only-include = ["keyfall", "README.md", "LICENSE", "pyproject.toml"]
artifacts = ["keyfall/static/**"]
